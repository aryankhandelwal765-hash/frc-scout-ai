# FRC Scout AI — full stack (Ollama + API/frontend combined).
#
# Bring it up:   docker compose up -d --build
# Tail logs:     docker compose logs -f api
# Pull the model: docker compose exec ollama ollama pull "${OLLAMA_MODEL:-qwen3:8b}"
#
# The model is configurable. qwen3:8b is the default and what the project is
# tuned for (~5-10s per read). To use something else, set OLLAMA_MODEL in .env
# and pull that instead — e.g. the larger qwen3.6:35b-a3b, which is optional and
# roughly 10x slower per read for a modest quality gain.
# Wipe cache:    curl -X DELETE http://localhost:8000/cache

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Uncomment on machines with an NVIDIA GPU (needs nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  api:
    build: .
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Ollama service DNS lives on the compose network as "ollama".
      # OLLAMA_HOST is the documented name; OLLAMA_BASE is a legacy alias.
      OLLAMA_HOST: http://ollama:11434
      # Overridable from .env; qwen3:8b is the default the project is tuned for.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      CACHE_DB_PATH: /data/cache.db
    volumes:
      - api_data:/data
    restart: unless-stopped

  # Optional: nginx serves the built frontend + proxies /api → api container.
  # Skip and hit the API directly at :8000 during development.
  frontend:
    image: nginx:alpine
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  ollama_data:
  api_data:
