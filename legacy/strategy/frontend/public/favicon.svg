<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Field crosshair">
  <!-- Field outline: the rectangular playing area, viewed top-down. -->
  <rect x="2.5" y="6.5" width="27" height="19" rx="2.5"
        fill="none" stroke="#863bff" stroke-width="2"/>
  <!-- Centre line. -->
  <line x1="16" y1="6.5" x2="16" y2="25.5" stroke="#863bff" stroke-width="1.4" opacity="0.55"/>
  <!-- Tracking crosshair over the centre of the field. -->
  <circle cx="16" cy="16" r="5" fill="none" stroke="#863bff" stroke-width="2"/>
  <line x1="16" y1="8.5"  x2="16" y2="11.5" stroke="#863bff" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="20.5" x2="16" y2="23.5" stroke="#863bff" stroke-width="2" stroke-linecap="round"/>
  <line x1="8.5"  y1="16" x2="11.5" y2="16" stroke="#863bff" stroke-width="2" stroke-linecap="round"/>
  <line x1="20.5" y1="16" x2="23.5" y2="16" stroke="#863bff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="1.5" fill="#863bff"/>
</svg>
